name: "setup-uv-env"
description: "Composite action to setup the Python and uv environment."

inputs:
  python-version:
    required: false
    description: "The python version to use"
    default: "3.14"
  github-token:
    required: false
    description: "GitHub token for caching uv binary"

outputs:
  python-version:
    description: "The resolved Python version"
    value: ${{ steps.setup-python.outputs.python-version }}

runs:
  using: "composite"
  steps:
    - name: "Install uv"
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.11.16"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        github-token: ${{ inputs.github-token }}

    - name: "Set up Python"
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"

    - name: Cache virtual environment
      id: cache-venv
      uses: actions/cache@v5
      with:
        path: .venv
        # Include the Python version: a venv restored for a different
        # interpreter breaks `uv run --no-project` (and wastes the cache).
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-

    - name: Install Python dependencies
      if: steps.cache-venv.outputs.cache-hit != 'true'
      run: uv sync --extra private
      shell: bash

    - name: Setup directories
      run: |
        mkdir -p .volumes/pgdata
        mkdir -p media/imagor_data/{storage,result}
      shell: bash
