services:
  mapproxy:
    image: ghcr.io/mapproxy/mapproxy/mapproxy:7.0.0-nginx
    container_name: wd-mapproxy-eu-topo
    ports:
      - "8090:80"
    volumes:
      - ./mapproxy.yaml:/mapproxy/config/mapproxy.yaml:ro
      - ./ch-boundary.geojson:/mapproxy/config/ch-boundary.geojson:ro
      - ./at-boundary.geojson:/mapproxy/config/at-boundary.geojson:ro
      - ./cache_data:/mapproxy/config/cache_data
    restart: unless-stopped
