# workz provisioning for wodore-backend agent worktrees.
# Docs: https://github.com/rohansx/workz — repo usage: AGENTS.md § Worktrees / workz
#
# What workz defaults already do: copy `.env`/`.env.*`/`.envrc` +
# tool-version files. `.venv` is deliberately NOT symlinked (see ignore_add
# below) — every lane gets its own venv via the post_start hook.
[sync]
# Gitignored repo files that must ride along into every worktree.
# NOTE: workz copy_add only handles regular files — directories are not
# copied (verified against the binary), so martin_sync/ is copied by the
# post_start hook (scripts/sync-martin.sh) instead.
copy_add = [
    ".infisical.json",          # infisical project link (needed by the `app` wrapper)
    ".geoplaces*",
]
# Per-lane venvs instead of a symlinked shared one: a shared venv's editable
# install pins the MAIN checkout on sys.path (app/manage silently ran main
# code inside lanes), and any lane running `uv sync` re-pointed that editable
# for everyone. uv makes own venvs cheap: hardlinked from the shared cache
# (~6 MB marginal disk, ~0.2 s warm sync).
# scripts/lane-venv.sh syncs (--frozen --extra private) and patches the
# activate script with a lane-aware `app()` that targets the LANE database
# (the main checkout's `inv update-venv --infisical` function wraps
# infisical, which injects the DEV database — wrong target for lanes).
ignore_add = [".venv"]

[hooks]
# Lane DB lives on the SHARED dev postgres (django-local-postgis:5432) under
# its own name, cloned from the quiescent `wodore_template` snapshot —
# same state as the dev main DB. Need current data? Refresh first:
#   scripts/db-refresh-template.sh
# Both hooks share their bodies with paseo.json (worktree.setup/teardown)
# and with the pi-agent lane step 1 — same scripts, every host.
post_start = 'scripts/lane-setup.sh'
pre_done = 'scripts/lane-teardown.sh'

[run]
# `workz run` executes this detached on the lane's allocated port. Never
# rely on the auto-detected bare `manage.py runserver`: it would bypass
# lane-run.sh (infisical + lane POSTGRES_DB/MARTIN_TILE_URL injection)
# and hit the shared dev database.
cmd = 'scripts/lane-dev.sh fg'

[isolation]
# Dev-server port range for `workz run` — clear of django (8000),
# martin (8075) and imagor (8079).
base_port = 3400
