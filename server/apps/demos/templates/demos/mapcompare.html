{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wodore basemap compare</title>

    <!-- Vendored assets (pinned versions, no CDN, works offline) -->
    <link rel="stylesheet" href="{% static 'demos/vendor/maplibre-gl.css' %}" />
    <link
      rel="stylesheet"
      href="{% static 'demos/vendor/map-gl-style-switcher.css' %}"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #1c1c1c;
      }

      /* Header sizes naturally (wraps on phones); the map area fills the
         rest — no hardcoded header height to drift out of sync. */
      body {
        display: flex;
        flex-direction: column;
      }

      .mode {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }

      #bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        padding: 6px 10px;
        background: #f2f7f4;
        border-bottom: 1px solid #d0d8d2;
      }

      /* Mobile: the permalink gives up its reserved width; the catalog
         input lives on its own collapsible row (see #catalog-row) so the
         primary buttons never wrap off-screen. */
      /* Collapsible catalog row: second header line with the input,
         toggled by #catalog-toggle. Collapsed by default on narrow
         screens (JS), always open-able. */
      #catalog-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-basis: 100%;
        min-width: 0;
      }

      #catalog-row[hidden] {
        display: none;
      }

      #catalog-row #tileserver-input {
        flex: 1 1 160px;
        min-width: 0;
      }

      #bust-cache-label {
        display: flex;
        gap: 4px;
        align-items: center;
        white-space: nowrap;
        color: #4d6b58;
        cursor: pointer;
      }

      #bar button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid #9aa8a0;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }

      #bar button:hover {
        background: #e8efe9;
      }

      #bar label {
        color: #4d6b58;
        white-space: nowrap;
      }

      #tileserver-input {
        font:
          12px ui-monospace,
          monospace;
        padding: 3px 6px;
        border: 1px solid #9aa8a0;
        border-radius: 4px;
        width: 240px;
      }


      /* View row: one header line with the A/B style buttons and the live
         view chip (z / coords / slug, + load timing). The chip flexes and
         is the only element allowed to ellipsize. */
      #view-row {
        flex-basis: 100%;
        display: flex;
        gap: 6px;
        align-items: center;
        min-width: 0;
      }

      #permalink {
        flex: 1 1 auto;
        min-width: 0;
        color: #1c1c1c;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #c5cfc8;
        border-radius: 4px;
        padding: 2px 6px;
        font: 11px/1.4 ui-monospace, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      #compare-wrap {
        position: absolute;
        inset: 0;
      }

      .compare-side {
        position: absolute;
        inset: 0;
      }

      /* keep each side's style switcher inside its half */
      #compare-a .maplibregl-ctrl-top-left {
        max-width: 50%;
      }

      /* compare slider (built-in) */
      #compare-handle {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 4px;
        margin-left: -2px;
        background: #fff;
        border: 1px solid #4d6b58;
        cursor: ew-resize;
        z-index: 10;
        touch-action: none;
      }

      /* Portrait / tall viewports: stack the sides vertically (B below
         the seam) and turn the handle into a horizontal bar. Toggled by
         JS (wrap.clientHeight > wrap.clientWidth), not a media query, so
         embedded/non-viewport sizes behave the same. */
      #compare-handle.vertical {
        top: 0;
        bottom: auto;
        left: 0;
        right: 0;
        width: auto;
        height: 4px;
        margin: -2px 0 0 0;
        cursor: ns-resize;
      }

      #compare-handle.vertical::after {
        content: "↕";
      }

      /* Vertical compare: B's top-right switcher would sit above the
         seam and get clipped away — flip it to the bottom-right. */
      #compare-wrap.compare-vertical #compare-b .maplibregl-ctrl-top-right {
        top: auto;
        bottom: 0;
      }

      #compare-wrap.compare-vertical #compare-b
        .maplibregl-ctrl-top-right
        .maplibregl-ctrl {
        margin-bottom: 34px;
      }

      #compare-handle::after {
        content: "↔";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 14px;
        color: #1c1c1c;
        background: #fff;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #4d6b58;
      }

      /* stats.js panel: JS pins it below the header (height varies when
         the header wraps on phones) */
      #fps-panel {
        position: fixed;
        top: 45px;
        right: 8px;
        z-index: 1000;
        cursor: pointer;
      }

      #fps-dom {
        position: static !important;
        top: auto !important;
        left: auto !important;
      }

      /* Style switcher (vendored control, tuned here):
         - list height tracks the viewport (vendored default is a fixed
           300px — too short for 12 catalog basemaps on phones, and it
           clipped inside the bottom half of a vertical compare)
         - touch-sized rows, no wrap, readable names */
      .maplibregl-ctrl.style-switcher .style-switcher-list {
        max-height: min(70vh, 420px) !important;
        overscroll-behavior: contain;
      }

      /* Two-line entries: display name over the slug. Scoped to the list
         so the collapsed chip keeps the vendored row layout. */
      .maplibregl-ctrl.style-switcher .style-switcher-list .style-switcher-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        min-height: 44px;
        padding: 4px 8px;
        white-space: normal;
      }

      .style-switcher-item .ss-name {
        line-height: 1.25;
      }

      .style-switcher-item .ss-slug {
        font:
          10px/1.3 ui-monospace,
          monospace;
        color: #68766e;
      }

      .style-switcher-item .ss-star {
        color: #d59b13;
        margin-right: 3px;
      }

      @media (pointer: coarse) {
        .maplibregl-ctrl.style-switcher .style-switcher-item {
          min-height: 40px;
          padding: 6px 10px;
          transform: none; /* hover-lift reads as tap-jitter on touch */
        }

        .maplibregl-ctrl.style-switcher
          .style-switcher-list
          .style-switcher-item {
          min-height: 48px;
        }
      }

      /* While side B's style menu is open in swipe mode, lift B's seam
         clip so the full menu is visible (B overlays A momentarily). */
      #compare-wrap.bmenu #compare-b {
        clip-path: none !important;
        z-index: 30;
      }

      /* 1:1 compare: two independent halves, no clip, no slider. Side by
         side in landscape, stacked in portrait. */
      #compare-wrap.grid11 {
        display: flex;
        flex-direction: row;
      }

      @media (orientation: portrait) {
        #compare-wrap.grid11 {
          flex-direction: column;
        }
      }

      #compare-wrap.grid11 .compare-side {
        position: relative;
        inset: auto;
        flex: 1 1 50%;
        min-width: 0;
        min-height: 0;
      }

      #compare-wrap.grid11 #compare-a {
        border-right: 1px solid #4d6b58;
      }

      @media (orientation: portrait) {
        #compare-wrap.grid11 #compare-a {
          border-right: none;
          border-bottom: 1px solid #4d6b58;
        }
      }

      /* Compare modes hide the whole attribution control — collapsed
         "© …" bars on both halves stack up at the seam/bottom and read as
         clutter (both class spellings across maplibre versions). The style
         documents themselves still carry attribution, and normal mode keeps
         its single control. */
      #compare-wrap .maplibregl-ctrl-attrib,
      #compare-wrap .maplibre-ctrl-attrib {
        display: none;
      }

      /* A/B style picker buttons + shared dialog (mobile). The in-map
         switcher menus do not fit half-width compare maps on phones; the
         header buttons open one shared dialog listing styles with the
         familiar two-line layout (name over slug). */
      .ab-btn {
        font: inherit;
        font-size: 11px;
        padding: 3px 6px;
        border: 1px solid #9aa8a0;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        white-space: nowrap;
        max-width: 38%;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 0 0 auto;
      }

      .ab-btn[hidden] {
        display: none;
      }

      @media (min-width: 641px) {
        .ab-btn {
          display: none !important;
        }
      }

      /* In-map switchers: desktop only (mobile uses the header buttons in
         every mode). */
      @media (max-width: 640px) {
        .style-switcher {
          display: none !important;
        }
      }

      #style-dialog-backdrop {
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      #style-dialog {
        background: #fff;
        border: 1px solid #4d6b58;
        border-radius: 10px 10px 0 0;
        width: 100%;
        max-width: 480px;
        max-height: 70vh;
        display: flex;
        flex-direction: column;
        padding: 6px 0 10px;
        box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.25);
      }

      #style-dialog h3 {
        margin: 4px 12px 8px;
        font-size: 13px;
        color: #4d6b58;
      }

      #style-dialog-list {
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
        padding: 0 6px;
      }

      .sd-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        min-height: 44px;
      }

      .sd-item:hover,
      .sd-item:active {
        background: #eef5f0;
      }

      .sd-item.selected {
        background: #e4f0e8;
        outline: 1px solid #4d6b58;
      }

      .sd-item .ss-name {
        line-height: 1.25;
      }

      .sd-item .ss-slug {
        font:
          10px/1.3 ui-monospace,
          monospace;
        color: #68766e;
      }

      .sd-item .ss-star {
        color: #d59b13;
        margin-right: 3px;
      }

      /* Desktop list polish: reserve a scrollbar gutter instead of the
         overlay scrollbar running over the item text (mobile WebKit). */
      .maplibregl-ctrl.style-switcher .style-switcher-list {
        scrollbar-gutter: stable;
      }

      /* Per-map copy controls (maplibre ctrl-group buttons) */
      .maplibregl-ctrl-group button.wd-copy-btn {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .maplibregl-ctrl-group button.wd-copy-btn.wd-copied {
        background: #e4f4e4;
        color: #1c5c1c;
      }

      /* built-in inspect popup */
      .inspect-popup {
        font:
          11px ui-monospace,
          monospace;
        background: #fff;
        border: 1px solid #9aa8a0;
        border-radius: 4px;
        padding: 4px 8px;
        max-width: 340px;
      }

      .inspect-popup .layer-id {
        font-weight: 700;
        color: #2a6;
      }

      .inspect-popup .source-layer {
        color: #666;
      }

      .inspect-popup .props {
        color: #333;
        margin-top: 2px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <header id="bar">
      <button id="mode-toggle" type="button">Compare mode</button>
      <button id="inspect-toggle" type="button" hidden>Inspect: off</button>
      <button id="catalog-toggle" type="button" title="Show/hide the catalog URL row">Catalog ▾</button>
      <div id="view-row">
        <button id="style-a-btn" class="ab-btn" type="button" hidden>A ▾</button>
        <button id="style-b-btn" class="ab-btn" type="button" hidden>B ▾</button>
        <span id="permalink" title="current view, copy me"></span>
      </div>
      <div id="catalog-row">
        <label for="tileserver-input">Catalog:</label>
        <input
          id="tileserver-input"
          type="text"
          title="Catalog URL (persisted; ?catalog= overrides on load; e.g. http://localhost:3745/v1/map/catalog or http://localhost:3739/catalog for Martin)"
        />
        <span id="catalog-link"
          ><a target="_blank" rel="noopener">Catalog ↗</a></span
        >
        <label id="bust-cache-label" title="Reload styles with a cache-busting parameter (cold style loads). Tiles keep their long-lived cache — for fully cold tiles use the browser devtools.">
          <input id="bust-cache" type="checkbox" />
          bust cache
        </label>
      </div>
    </header>

    <!-- normal mode -->
    <main id="normal" class="mode">
      <div id="map"></div>
    </main>

    <!-- compare mode -->
    <main id="compare" class="mode" hidden>
      <div id="compare-wrap">
        <div id="compare-a" class="compare-side"></div>
        <div id="compare-b" class="compare-side"></div>
      </div>
    </main>

    <!-- shared basemap picker dialog (mobile header A/B buttons) -->
    <div id="style-dialog-backdrop" hidden>
      <div id="style-dialog" role="dialog" aria-label="Choose basemap">
        <h3 id="style-dialog-title">Style</h3>
        <div id="style-dialog-list"></div>
      </div>
    </div>

    <script src="{% static 'demos/vendor/maplibre-gl.js' %}"></script>
    <script src="{% static 'demos/vendor/map-gl-style-switcher.js' %}"></script>
    <script src="{% static 'demos/vendor/stats.min.js' %}"></script>
    <script>
      /* Wodore basemap compare — dev tool (server.apps.demos).
       *
       * Vendored pins: maplibre-gl@5.6.0 UMD, map-gl-style-switcher@0.10.1
       * UMD, stats.js@0.17.0 (FPS via rAF — mapbox-gl-framerate is not on
       * npm). Inspect is a built-in popup (maplibre-gl-inspect@0.0.10 was
       * incompatible with maplibre-gl 5.x — documented in the PR).
       */
      (function () {
        "use strict";

        var q = new URLSearchParams(location.search);
        var DEFAULT_CATALOG = location.origin + "/v1/map/catalog";
        // localStorage can throw (private mode / blocked storage) — a throw
        // here would kill the whole script and leave no map at all.
        var storedCatalog = null;
        try {
          storedCatalog = localStorage.getItem("mapcompare:catalog");
        } catch (err) {
          void err;
        }
        var CATALOG_URL = q.get("catalog") || storedCatalog || DEFAULT_CATALOG;

        // Parsed+clamped numeric URL param (NaN/garbage falls back to the
        // default instead of poisoning the camera and the permalink).
        function numParam(raw, fallback, min, max) {
          var v = parseFloat(raw);
          if (!isFinite(v)) return fallback;
          return Math.min(max, Math.max(min, v));
        }

        var FALLBACK_STYLES = [
          "wd-outdoor-base-mtk-hill", // the product default (frontend PR #292)
          "wd-outdoor-base-mtk",
          "wd-outdoor-base-ofm",
          "wd-outdoor-base-ofm-hill",
        ];
        var state = {
          style: q.get("style") || "wd-outdoor-base-mtk-hill",
          styleB: q.get("styleB") || "wd-outdoor-base-ofm",
          zoom: numParam(q.get("z"), 12, 0, 22),
          center: [
            numParam(q.get("lon"), 11.4041, -180, 180),
            numParam(q.get("lat"), 47.2692, -85, 85),
          ],
          mode: (function () {
            var m = q.get("mode");
            if (m === "11" || m === "1:1") return "11";
            if (m === "compare" || m === "swipe") return "swipe";
            return "normal";
          })(),
          inspect: false,
        };
        var styleIds = FALLBACK_STYLES.slice();

        var els = {
          modeToggle: document.getElementById("mode-toggle"),
          inspectToggle: document.getElementById("inspect-toggle"),
          catalogToggle: document.getElementById("catalog-toggle"),
          catalogRow: document.getElementById("catalog-row"),
          tileserverInput: document.getElementById("tileserver-input"),
          catalogLink: document.querySelector("#catalog-link a"),
          permalink: document.getElementById("permalink"),
          normal: document.getElementById("normal"),
          compare: document.getElementById("compare"),
        };

        var normalMap = null;
        var compareMaps = null;
        var fpsStats = null;
        var fpsRaf = 0;
        var inspectPopup = null;
        var inspectHandler = null;
        // MutationObservers of live style switchers — disconnected on
        // teardown so mode switches never accumulate stale observers.
        var switcherObservers = [];

        // ---------- catalog URL ----------
        function catalogOrigin() {
          try {
            return new URL(CATALOG_URL).origin;
          } catch (e) {
            return "";
          }
        }

        function updateTileserverUI() {
          els.tileserverInput.value = CATALOG_URL;
          // Only http(s) origins — the value is free text and a javascript:
          // URL would execute on click.
          els.catalogLink.href = /^https?:/i.test(CATALOG_URL)
            ? CATALOG_URL
            : "about:blank";
        }

        function setTileserver(url) {
          var clean = url.trim();
          if (!clean || clean === CATALOG_URL) return;
          CATALOG_URL = clean;
          try {
            localStorage.setItem("mapcompare:catalog", CATALOG_URL);
          } catch (err) {
            void err; // private mode — the URL still applies for this session
          }
          updateTileserverUI();
          syncPermalink();
          bootCatalog(); // re-fetch styles, rebuild switchers
        }

        els.tileserverInput.addEventListener("change", function () {
          setTileserver(this.value);
        });
        els.tileserverInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            setTileserver(this.value);
            this.blur();
          }
        });

        // ---------- helpers ----------
        // Cache busting: appends a fresh query param to every style URL so
        // style documents load cold (tiles keep their long-lived caches —
        // see the checkbox tooltip).
        var bustCache = false;
        try {
          bustCache = localStorage.getItem("mapcompare:bust") === "1";
        } catch (err) {
          void err;
        }

        function styleUrl(id) {
          // Backend catalog entries have explicit paths; Martin entries need
          // /style/{id}.json constructed from the catalog origin
          var base = backendStyles[id] || catalogOrigin() + "/style/" + id + ".json";
          if (!bustCache) return base;
          return base + (base.indexOf("?") >= 0 ? "&" : "?") + "_=" + Date.now();
        }

        // Style slugs -> backend style URLs (filled by fetchBackendCatalog)
        var backendStyles = {};
        // Style slugs -> display names from the catalog (fallback: slug)
        var styleNames = {};
        // The catalog's default basemap (from /v1/map/layers is_default); the
        // star marks whatever the catalog says is default — falls back to the
        // product default slug when no layers endpoint answered.
        var catalogDefaultSlug = "wd-outdoor-base-mtk-hill";

        function styleDisplayName(id) {
          var name = styleNames[id] || id.replace(/^wd-outdoor-base-/, "");
          var prefix = id === catalogDefaultSlug ? "\u2605 " : "";
          return prefix + name;
        }

        function switcherStyles() {
          return styleIds.map(function (id) {
            return {
              id: id,
              name: styleDisplayName(id),
              uri: styleUrl(id),
            };
          });
        }

        function syncPermalink() {
          var p = new URLSearchParams();
          p.set("catalog", CATALOG_URL);
          p.set("style", state.style);
          if (state.mode !== "normal") p.set("styleB", state.styleB);
          p.set("z", state.zoom.toFixed(2));
          p.set("lon", state.center[0].toFixed(5));
          p.set("lat", state.center[1].toFixed(5));
          if (state.mode === "swipe") p.set("mode", "swipe");
          if (state.mode === "11") p.set("mode", "11");
          history.replaceState(null, "", location.pathname + "?" + p);
        }

        function trackView(map) {
          map.on("moveend", function () {
            state.center = map.getCenter().toArray();
            state.zoom = map.getZoom();
            syncPermalink();
          });
        }

        // ---------- per-map copy controls (maplibre ctrl buttons) ----------
        // A ctrl-group with two buttons per map: link icon copies THAT
        // map's style URL, code icon copies a JSON blob with the view
        // context (name, slug, url, zoom, center, mode, …) — for issue
        // reports and pasting map state into chats/tickets.
        var ICON_COPY =
          '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>';
        var ICON_CODE =
          '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>';

        function styleInfoJson(slug, map) {
          var c = map.getCenter();
          return JSON.stringify(
            {
              name: (styleNames[slug] || slug).replace(/^\u2605 /, ""),
              slug: slug,
              url: styleUrl(slug),
              mode: state.mode,
              zoom: Math.round(map.getZoom() * 100) / 100,
              center: {
                lat: Math.round(c.lat * 100000) / 100000,
                lng: Math.round(c.lng * 100000) / 100000,
              },
              bearing: Math.round(map.getBearing() * 10) / 10,
              pitch: Math.round(map.getPitch() * 10) / 10,
              catalog: CATALOG_URL,
              captured_at: new Date().toISOString(),
            },
            null,
            2,
          );
        }

        function CopyStyleControl(getSlug, getMap) {
          this._getSlug = getSlug;
          this._getMap = getMap;
        }
        CopyStyleControl.prototype.onAdd = function () {
          var self = this;
          this._container = document.createElement("div");
          this._container.className = "maplibregl-ctrl maplibregl-ctrl-group";

          function mkBtn(icon, title, build) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "wd-copy-btn";
            b.title = title;
            b.setAttribute("aria-label", title);
            b.innerHTML = icon;
            b.addEventListener("click", function () {
              copyText(build()).then(
                function () {
                  b.classList.add("wd-copied");
                  setTimeout(function () {
                    b.classList.remove("wd-copied");
                  }, 900);
                },
                function () {
                  b.title = "copy failed — see header button";
                },
              );
            });
            return b;
          }

          this._container.appendChild(
            mkBtn(ICON_COPY, "Copy this style's URL", function () {
              return styleUrl(self._getSlug());
            }),
          );
          this._container.appendChild(
            mkBtn(ICON_CODE, "Copy map info as JSON", function () {
              return styleInfoJson(self._getSlug(), self._getMap());
            }),
          );
          return this._container;
        };
        CopyStyleControl.prototype.onRemove = function () {
          this._container?.remove();
          this._container = null;
        };

        function addCopyControls(map, which) {
          // which: "A" (normal + compare A) or "B". Slug is read live so the
          // buttons stay correct after a style switch. Bottom corners: the
          // expanding style switcher used to push these around when they
          // shared the top corner, and bottom-right keeps them on side B's
          // visible half in swipe mode.
          map.addControl(
            new CopyStyleControl(
              function () {
                return which === "B" ? state.styleB : state.style;
              },
              function () {
                return map;
              },
            ),
            which === "B" ? "bottom-right" : "bottom-left",
          );
        }

        // ---------- live view chip (z / coords / style slug / load) ----------
        // Bound to whichever map drives the view (normal map, compare side
        // A \u2014 cameras sync). Carries its own coordinates in screenshots;
        // in normal mode it also reports load timing: "load" = until no
        // open tile requests (areTilesLoaded), "idle" = fully rendered.
        var viewChip = document.getElementById("permalink");
        var loadTiming = null; // {start, tilesMs, idleMs, map}
        function fmtViewChip(map) {
          var c = map.getCenter();
          var lat = c.lat.toFixed(4) + "\u00b0" + (c.lat >= 0 ? "N" : "S");
          var lon = c.lng.toFixed(4) + "\u00b0" + (c.lng >= 0 ? "E" : "W");
          var slug = state.style;
          var parts = ["z" + map.getZoom().toFixed(2), lat + " " + lon, slug];
          // Load timing only when there is room — on phones the chip must
          // show z + coords + slug without trimming.
          var roomForTiming = window.innerWidth >= 500;
          if (roomForTiming && loadTiming && loadTiming.map === map) {
            if (loadTiming.tilesMs != null)
              parts.push("load " + (loadTiming.tilesMs / 1000).toFixed(1) + "s");
            if (loadTiming.idleMs != null)
              parts.push("idle " + (loadTiming.idleMs / 1000).toFixed(1) + "s");
          }
          viewChip.textContent = parts.join(" \u00b7 ");
        }
        function bindPosReadout(map) {
          map.on("move", function () {
            fmtViewChip(map);
          });
          fmtViewChip(map);
        }
        function refreshViewChip() {
          fmtViewChip(normalMap || (compareMaps && compareMaps.a));
        }

        // ---------- A/B style picker dialog (mobile, all modes) ----------
        // The in-map switcher menus do not fit half-width compare maps on
        // phones; compact header buttons open ONE shared dialog listing the
        // styles with the two-line layout (name over slug). Side B's button
        // is hidden in normal mode (nothing to compare against).
        var abBtns = {
          A: document.getElementById("style-a-btn"),
          B: document.getElementById("style-b-btn"),
        };
        var sdBackdrop = document.getElementById("style-dialog-backdrop");
        var sdList = document.getElementById("style-dialog-list");
        var sdTitle = document.getElementById("style-dialog-title");
        var sdSide = "A";

        function shortLabel(slug) {
          return slug
            .replace("wd-outdoor-base-", "")
            .replace("ch-swisstopo-", "")
            .replace("world-", "")
            .slice(0, 16);
        }

        function refreshABButtons() {
          abBtns.A.textContent = "A: " + shortLabel(state.style) + " \u25be";
          abBtns.B.textContent = "B: " + shortLabel(state.styleB) + " \u25be";
          abBtns.A.hidden = false;
          abBtns.B.hidden = state.mode === "normal";
        }

        function openStyleDialog(side) {
          sdSide = side;
          var current = side === "B" ? state.styleB : state.style;
          sdTitle.textContent =
            "Basemap for " + (side === "B" ? "side B" : "the map (A)");
          sdList.innerHTML = "";
          for (var i = 0; i < styleIds.length; i++) {
            var id = styleIds[i];
            var item = document.createElement("div");
            item.className = "sd-item" + (id === current ? " selected" : "");
            var nameLine = document.createElement("span");
            nameLine.className = "ss-name";
            var name = styleDisplayName(id).replace(/^\u2605 /, "");
            if (id === catalogDefaultSlug) {
              var star = document.createElement("span");
              star.className = "ss-star";
              star.textContent = "\u2605";
              nameLine.appendChild(star);
            }
            nameLine.appendChild(document.createTextNode(name));
            var slugLine = document.createElement("span");
            slugLine.className = "ss-slug";
            slugLine.textContent = id;
            item.appendChild(nameLine);
            item.appendChild(slugLine);
            item.addEventListener(
              "click",
              (function (chosen) {
                return function () {
                  applyABSelect(sdSide, chosen);
                  closeStyleDialog();
                };
              })(id),
            );
            sdList.appendChild(item);
          }
          sdBackdrop.hidden = false;
        }

        function closeStyleDialog() {
          sdBackdrop.hidden = true;
        }

        abBtns.A.addEventListener("click", function () {
          openStyleDialog("A");
        });
        abBtns.B.addEventListener("click", function () {
          openStyleDialog("B");
        });
        sdBackdrop.addEventListener("click", function (e) {
          if (e.target === sdBackdrop) closeStyleDialog();
        });

        function refreshABSelects() {
          // kept name (callers exist): refresh the header buttons
          refreshABButtons();
        }

        function applyABSelect(side, slug) {
          if (side === "B") state.styleB = slug;
          else state.style = slug;
          var map =
            side === "B"
              ? compareMaps && compareMaps.b
              : compareMaps
                ? compareMaps.a
                : normalMap;
          if (map) {
            prefetchStyleAssets(styleUrl(slug));
            map.setStyle(styleUrl(slug));
          }
          syncPermalink();
          refreshViewChip();
          refreshABButtons();
        }

        // ---------- load timing (normal mode) ----------
        function trackLoadTiming(map) {
          loadTiming = { start: performance.now(), tilesMs: null, idleMs: null, map: map };
          var poll = setInterval(function () {
            if (!loadTiming || loadTiming.map !== map) return clearInterval(poll);
            if (loadTiming.tilesMs == null && map.areTilesLoaded()) {
              loadTiming.tilesMs = performance.now() - loadTiming.start;
              refreshViewChip();
            }
            if (loadTiming.tilesMs != null && loadTiming.idleMs != null)
              clearInterval(poll);
          }, 150);
          map.once("idle", function () {
            if (!loadTiming || loadTiming.map !== map) return;
            loadTiming.idleMs = performance.now() - loadTiming.start;
            refreshViewChip();
          });
        }

        function makeMap(container, styleId) {
          return new maplibregl.Map({
            container: container,
            style: styleUrl(styleId),
            center: state.center,
            zoom: state.zoom,
            attributionControl: { compact: true },
          });
        }

        // Reformat switcher list items into two lines (display name +
        // slug). The vendored control re-renders on every expand, so a
        // MutationObserver keeps the format applied; the list order
        // matches switcherStyles() one-to-one (the collapsed chip after
        // the list is left untouched).
        function twoLineSwitcherItems(container, stylesArr) {
          var items = container.querySelectorAll(
            ".style-switcher-list .style-switcher-item",
          );
          for (var i = 0; i < items.length; i++) {
            var el = items[i];
            var s = stylesArr[i];
            if (!s || el.dataset.twoLine) continue;
            el.dataset.twoLine = "1";
            var name = (s.name || "").replace(/^\u2605 /, "");
            el.textContent = "";
            if ((s.name || "").startsWith("\u2605 ")) {
              var star = document.createElement("span");
              star.className = "ss-star";
              star.textContent = "\u2605";
              el.appendChild(star);
            }
            var nameEl = document.createElement("span");
            nameEl.className = "ss-name";
            nameEl.textContent = name;
            el.appendChild(nameEl);
            var slug = document.createElement("span");
            slug.className = "ss-slug";
            slug.textContent = s.id;
            el.appendChild(slug);
          }
        }

        function addSwitcher(map, which) {
          // Cap the list to the map's own height — compare halves are
          // half as tall, an uncapped list gets cut by the screen edge.
          var avail =
            (map.getContainer().clientHeight || 400) - 90;
          var ctrl = new mapglstyleswitcher.StyleSwitcherControl({
            styles: switcherStyles(),
            activeStyleId: which === "B" ? state.styleB : state.style,
            showImages: false,
            maxHeight: Math.max(160, Math.min(420, avail)),
            onAfterStyleChange: function (prev, next) {
              if (!next) return;
              map.setStyle(next.uri);
              if (which === "B") state.styleB = next.id;
              else state.style = next.id;
              syncPermalink();
              // Normal mode: restart load timing for the new style and
              // refresh the view chip (slug part) everywhere.
              if (which === "A" && normalMap) trackLoadTiming(normalMap);
              refreshViewChip();
              refreshABSelects(); // keep the mobile A/B selects in sync
            },
          });
          // Side B's switcher goes top-right: the compare slider's clip-path
          // on compare-b hides top-left controls
          map.addControl(ctrl, which === "B" ? "top-right" : "top-left");
          // Touch: the vendored control expands on hover/focus only — no
          // hover on phones, and focus alone is unreliable. Tap-to-toggle:
          // a tap on the collapsed chip expands it; taps on list items keep
          // the vendored item handlers (the list is only rendered when
          // expanded, so the intercept only fires when collapsed).
          var container = ctrl._container;
          if (container) {
            // Touch open/close. The vendored control expands on hover and
            // focus — on phones focus fires during the first tap, which
            // re-renders the list UNDER the finger before the click event
            // dispatches: the click then lands on the FIRST list item and
            // silently selects it ("opens and takes the first value"). Fix:
            // expand on pointerdown and swallow the synthetic click of that
            // same tap (capture phase, before the item handlers).
            var swallowNextClick = false;
            container.addEventListener("pointerdown", function () {
              if (!container.querySelector(".style-switcher-list")) {
                swallowNextClick = true;
                ctrl._setExpanded(true);
              }
            });
            container.addEventListener(
              "click",
              function (e) {
                if (swallowNextClick) {
                  swallowNextClick = false;
                  e.stopPropagation();
                  e.preventDefault();
                  return;
                }
                if (e.target.closest(".style-switcher-item")) {
                  // tap on an item: let the vendored handler select first,
                  // then collapse — no hover-out on touch to close it.
                  setTimeout(function () {
                    ctrl._setExpanded(false);
                  }, 0);
                }
              },
              true,
            );
            var reformat = function () {
              // NOTE: list items are matched to switcherStyles() by index —
              // the vendored control renders styles in array order.
              twoLineSwitcherItems(container, switcherStyles());
              // Swipe mode clips side B at the seam — its expanding list
              // would be cut in half. While B's list is open, lift the clip
              // so the full menu is visible (B overlays A for the moment).
              var wrap = document.getElementById("compare-wrap");
              if (wrap) {
                wrap.classList.toggle(
                  "bmenu",
                  which === "B" &&
                    state.mode === "swipe" &&
                    !!container.querySelector(".style-switcher-list"),
                );
              }
            };
            var obs = new MutationObserver(reformat);
            obs.observe(container, { childList: true, subtree: true });
            switcherObservers.push(obs);
            reformat();
          }
        }

        // ---------- FPS (stats.js, rAF driven) ----------
        function pinFpsPanel() {
          // Header height varies when it wraps — pin the panel below it.
          var panel = document.getElementById("fps-panel");
          if (!panel) return;
          panel.style.top = document.getElementById("bar").offsetHeight + 6 + "px";
        }
        window.addEventListener("resize", pinFpsPanel);

        function startFps() {
          if (fpsStats) return;
          fpsStats = new Stats();
          fpsStats.showPanel(0);
          fpsStats.dom.id = "fps-dom";
          var wrap = document.createElement("div");
          wrap.id = "fps-panel";
          wrap.appendChild(fpsStats.dom);
          document.body.appendChild(wrap);
          pinFpsPanel();
          var tick = function () {
            fpsStats.begin();
            fpsStats.end();
            fpsRaf = requestAnimationFrame(tick);
          };
          fpsRaf = requestAnimationFrame(tick);
        }
        function stopFps() {
          if (!fpsStats) return;
          cancelAnimationFrame(fpsRaf);
          var wrap = document.getElementById("fps-panel");
          if (wrap) wrap.remove();
          fpsStats = null;
        }

        // ---------- inspect (built-in popup) ----------
        // maplibre-gl-inspect@0.0.10 is incompatible with maplibre-gl 5.x
        // (its ESM bundle imports a peer `maplibre-gl` that resolves to a
        // second, older instance). This built-in does what the user needs:
        // click a feature → popup with layer.id + source-layer + props.
        function toggleInspect() {
          state.inspect = !state.inspect;
          els.inspectToggle.textContent =
            "Inspect: " + (state.inspect ? "on" : "off");
          if (state.inspect) enableInspect();
          else disableInspect();
        }

        function enableInspect() {
          if (!normalMap || inspectHandler) return;
          inspectHandler = function (e) {
            var feats = normalMap.queryRenderedFeatures(e.point);
            if (!feats.length) {
              if (inspectPopup) {
                inspectPopup.remove();
                inspectPopup = null;
              }
              return;
            }
            var f = feats[0];
            // Build the popup with DOM APIs (textContent) — layer ids and
            // feature properties come from whatever tileserver the catalog
            // points at, so string-built HTML would be an injection surface.
            var box = document.createElement("div");
            box.className = "inspect-popup";
            var layerId = document.createElement("span");
            layerId.className = "layer-id";
            layerId.textContent = f.layer.id;
            var sourceLayer = document.createElement("span");
            sourceLayer.className = "source-layer";
            sourceLayer.textContent = "(" + (f.sourceLayer || f.source || "?") + ")";
            box.appendChild(layerId);
            box.appendChild(sourceLayer);
            var propKeys = Object.keys(f.properties || {}).slice(0, 8);
            if (propKeys.length) {
              var props = document.createElement("div");
              props.className = "props";
              props.textContent = propKeys
                .map(function (k) {
                  return k + ": " + JSON.stringify(f.properties[k]);
                })
                .join("\n");
              box.appendChild(props);
            }
            if (inspectPopup) inspectPopup.remove();
            inspectPopup = new maplibregl.Popup({
              closeButton: false,
              closeOnClick: false,
            })
              .setLngLat(e.lngLat)
              .setDOMContent(box)
              .addTo(normalMap);
          };
          normalMap.on("click", inspectHandler);
          normalMap.getCanvas().style.cursor = "crosshair";
        }

        function disableInspect() {
          if (normalMap && inspectHandler) {
            normalMap.off("click", inspectHandler);
            normalMap.getCanvas().style.cursor = "";
          }
          inspectHandler = null;
          if (inspectPopup) {
            inspectPopup.remove();
            inspectPopup = null;
          }
        }

        // ---------- modes ----------
        function enterNormal() {
          teardown();
          document.body.classList.remove("compare-mode");
          els.normal.hidden = false;
          els.compare.hidden = true;
          els.inspectToggle.hidden = false;
          normalMap = makeMap("map", state.style);
          addSwitcher(normalMap, "A");
          addCopyControls(normalMap, "A");
          trackView(normalMap);
          bindPosReadout(normalMap);
          trackLoadTiming(normalMap);
          refreshABSelects(); // header A button (B hidden in normal mode)
          startFps();
          if (state.inspect) enableInspect();
          els.modeToggle.textContent = "Compare mode";
        }

        function enterCompare(kind) {
          // kind: "swipe" (slider over one map) or "11" (two halves)
          teardown();
          document.body.classList.add("compare-mode");
          els.normal.hidden = true;
          els.compare.hidden = false;
          els.inspectToggle.hidden = true;
          disableInspect();

          var wrap = document.getElementById("compare-wrap");
          if (kind === "11") wrap.classList.add("grid11");

          var a = makeMap("compare-a", state.style);
          var b = makeMap("compare-b", state.styleB);
          addSwitcher(a, "A");
          addSwitcher(b, "B");
          addCopyControls(a, "A");
          addCopyControls(b, "B");
          trackView(a);
          bindPosReadout(a);
          compareMaps = {
            a: a,
            b: b,
            handle:
              kind === "swipe"
                ? makeCompareSlider(a, b, "compare-wrap")
                : makeCameraSync(a, b),
          };
          // Button cycles to the next mode; label always names the NEXT
          // mode so it doubles as the state display.
          els.modeToggle.textContent =
            kind === "swipe" ? "Compare 1:1" : "Normal mode";
          refreshABSelects();
          // FPS panel is normal-mode only — in compare modes it fought
          // with the switcher menus for space.
        }

        // ---------- camera sync (shared by swipe and 1:1) ----------
        // Mirror moves one way only while a jumpTo is in flight. The naive
        // movestart/syncA flag design ping-pongs — jumpTo fires movestart on
        // the destination, flipping the sync direction mid-gesture, and the
        // reverse sync cancels touch pinch-zoom ("cannot zoom in compare
        // mode"). The equality short-circuit also guards against a future
        // maplibre emitting jumpTo's move asynchronously. jumpTo has no
        // inertia, so skipping no-op jumps stops redundant churn per
        // inertial frame.
        function makeCameraSync(mapA, mapB) {
          var syncing = false;
          function sameCamera(a, b) {
            var ca = a.getCenter();
            var cb = b.getCenter();
            return (
              Math.abs(ca.lng - cb.lng) < 1e-9 &&
              Math.abs(ca.lat - cb.lat) < 1e-9 &&
              Math.abs(a.getZoom() - b.getZoom()) < 1e-6 &&
              Math.abs(a.getBearing() - b.getBearing()) < 1e-6 &&
              Math.abs(a.getPitch() - b.getPitch()) < 1e-6
            );
          }
          function syncCameras(src, dst) {
            if (syncing || sameCamera(src, dst)) return;
            syncing = true;
            try {
              dst.jumpTo({
                center: src.getCenter(),
                zoom: src.getZoom(),
                bearing: src.getBearing(),
                pitch: src.getPitch(),
              });
            } finally {
              syncing = false;
            }
          }
          mapA.on("move", function () {
            syncCameras(mapA, mapB);
          });
          mapB.on("move", function () {
            syncCameras(mapB, mapA);
          });
          return {
            remove: function () {},
          };
        }

        // ---------- compare slider (built-in, swipe mode) ----------
        function makeCompareSlider(mapA, mapB, wrapId) {
          var wrap = document.getElementById(wrapId);
          var sideB = document.getElementById("compare-b");
          var handle = document.createElement("div");
          handle.id = "compare-handle";
          wrap.appendChild(handle);

          var pos = 0.5;
          function isVertical() {
            return wrap.clientHeight > wrap.clientWidth;
          }
          function apply() {
            var vertical = isVertical();
            handle.classList.toggle("vertical", vertical);
            wrap.classList.toggle("compare-vertical", vertical);
            if (vertical) {
              var y = Math.round(pos * wrap.clientHeight);
              sideB.style.clipPath = "inset(" + y + "px 0 0 0)";
              handle.style.top = y + "px";
              handle.style.left = "0";
            } else {
              var x = Math.round(pos * wrap.clientWidth);
              sideB.style.clipPath = "inset(0 0 0 " + x + "px)";
              handle.style.left = x + "px";
              handle.style.top = "0";
            }
          }

          makeCameraSync(mapA, mapB);

          var dragging = false;
          handle.addEventListener("pointerdown", function (e) {
            dragging = true;
            handle.setPointerCapture(e.pointerId);
            e.preventDefault();
          });
          handle.addEventListener("pointermove", function (e) {
            if (!dragging) return;
            var rect = wrap.getBoundingClientRect();
            if (isVertical()) {
              pos = Math.min(
                1,
                Math.max(0, (e.clientY - rect.top) / rect.height),
              );
            } else {
              pos = Math.min(
                1,
                Math.max(0, (e.clientX - rect.left) / rect.width),
              );
            }
            apply();
          });
          handle.addEventListener("pointerup", function () {
            dragging = false;
          });
          handle.addEventListener("pointercancel", function () {
            dragging = false;
          });

          mapA.on("resize", apply);
          apply();
          return {
            remove: function () {
              handle.remove();
              wrap.classList.remove("compare-vertical");
              sideB.style.clipPath = "";
            },
          };
        }

        function teardown() {
          stopFps();
          disableInspect();
          while (switcherObservers.length) {
            try {
              switcherObservers.pop().disconnect();
            } catch (err) {
              void err;
            }
          }
          document
            .getElementById("compare-wrap")
            .classList.remove("grid11", "compare-vertical", "bmenu");
          if (compareMaps) {
            if (compareMaps.handle && compareMaps.handle.remove) {
              try {
                compareMaps.handle.remove();
              } catch (err) {
                void err;
              }
            }
            if (compareMaps.a) compareMaps.a.remove();
            if (compareMaps.b) compareMaps.b.remove();
            compareMaps = null;
          }
          if (normalMap) {
            normalMap.remove();
            normalMap = null;
          }
        }

        // ---------- catalog / boot ----------
        // Fetches CATALOG_URL and parses the response. Works with both our
        // backend catalog (/v1/map/catalog, entries have .path relative URLs
        // and selector metadata) and Martin's catalog (/catalog, entries
        // have filesystem paths — style URLs constructed from origin).
        function bootCatalog() {
          var origin = catalogOrigin();
          fetch(CATALOG_URL)
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (cat) {
              if (!cat || !cat.styles) return null;
              var ids = [];
              backendStyles = {};
              styleNames = {};
              for (var slug in cat.styles) {
                if (!Object.prototype.hasOwnProperty.call(cat.styles, slug))
                  continue;
                var entry = cat.styles[slug];
                // Backend: entry.path is a relative URL like /v1/map/styles/slug.json
                // Martin: entry.path is a filesystem path — construct /style/slug.json
                var url;
                if (/^https?:/i.test(entry.path || "")) {
                  // externally authored style (e.g. swisstopo light
                  // basemap): absolute URL, used verbatim
                  url = entry.path;
                } else if (entry.path && entry.path.startsWith("/")) {
                  url = origin + entry.path;
                } else {
                  // Martin catalog: filesystem paths
                  url = origin + "/style/" + slug + ".json";
                }
                backendStyles[slug] = url;
                styleNames[slug] =
                  entry.name ||
                  slug.replace(/^wd-outdoor-base-/, "");
                ids.push(slug);
              }
              // Catalog style entries carry no role — overlays (huts,
              // trails, …) leaked into the selector. The backend layers
              // endpoint has it; when reachable, keep basemaps only
              // (Martin catalogs have no layers endpoint → keep all,
              // Martin only serves basemap-ish styles anyway).
              var rolesUrl = origin + "/v1/map/layers";
              return fetch(rolesUrl)
                .then(function (r) {
                  return r.ok ? r.json() : null;
                })
                .catch(function () {
                  return null;
                })
                .then(function (ld) {
                  if (ld && ld.data) {
                    var roles = {};
                    var defaultSlug = null;
                    for (var i = 0; i < ld.data.length; i++) {
                      roles[ld.data[i].slug] = ld.data[i].role;
                      if (ld.data[i].is_default) defaultSlug = ld.data[i].slug;
                    }
                    if (defaultSlug) catalogDefaultSlug = defaultSlug;
                    ids = ids.filter(function (slug) {
                      return !roles[slug] || roles[slug] === "basemap";
                    });
                    // Adopt the catalog's default basemap when the URL
                    // pinned no explicit style — the first list entry is
                    // just an ordering, not the default.
                    if (defaultSlug && !q.get("style")) {
                      state.style = defaultSlug;
                    }
                  }
                  if (ids.length) styleIds = ids;
                });
            })
            .catch(function () {
              /* catalog unavailable: keep fallback list */
            })
            .finally(function () {
              prefetchStyleAssets(styleUrl(state.style));
              if (state.mode !== "normal")
                prefetchStyleAssets(styleUrl(state.styleB));
              if (state.mode === "11") {
                enterCompare("11");
              } else if (state.mode === "swipe") {
                enterCompare("swipe");
              } else {
                enterNormal();
              }
              syncPermalink();
            });
        }

        // ---------- preloading ----------
        // Two cheap wins on top of HTTP caching:
        // - maplibregl.prewarm(): start the WebGL worker pools before the
        //   first map exists (built-in).
        // - prefetchStyleAssets(): fetch the style document + sprites +
        //   glyph ranges into the HTTP cache, fire-and-forget. Style
        //   switches and the compare side-B map then hit warm cache.
        //   (Tile prefetch for targeted moves exists as the community
        //   plugin maplibre-preload — not vendored here; our styles are
        //   already server-cacheable.)
        function prefetchQuietly(url) {
          fetch(url).catch(function () {
            /* warm-attempt only */
          });
        }

        function prefetchStyleAssets(url) {
          fetch(url)
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (style) {
              if (!style) return;
              var sprites = style.sprite || [];
              if (!Array.isArray(sprites)) sprites = [sprites];
              sprites.forEach(function (sp) {
                if (!sp || !sp.url) return;
                prefetchQuietly(sp.url + ".json");
                prefetchQuietly(sp.url + ".png");
                prefetchQuietly(sp.url + "@2x.json");
              });
              if (typeof style.glyphs === "string") {
                var seen = {};
                style.layers.forEach(function (l) {
                  var f = l.layout && l.layout["text-font"];
                  if (Array.isArray(f)) {
                    f.forEach(function (name) {
                      if (typeof name !== "string" || seen[name]) return;
                      seen[name] = true;
                      prefetchQuietly(
                        style.glyphs
                          .replace("{fontstack}", encodeURIComponent(name))
                          .replace("{range}", "0-255"),
                      );
                    });
                  }
                });
              }
            })
            .catch(function () {});
        }

        if (maplibregl.prewarm) maplibregl.prewarm();

        // ---------- boot ----------
        // Catalog row: collapsed by default on narrow screens (the input
        // pushed the primary buttons off-screen on phones), open on
        // desktop. The toggle flips it either way.
        els.catalogRow.hidden = window.matchMedia(
          "(max-width: 640px)",
        ).matches;
        els.catalogToggle.addEventListener("click", function () {
          els.catalogRow.hidden = !els.catalogRow.hidden;
          els.catalogToggle.textContent = els.catalogRow.hidden
            ? "Catalog \u25be"
            : "Catalog \u25b4";
          // Autofocus only with a fine pointer — on phones it pops the
          // keyboard over the map.
          if (
            !els.catalogRow.hidden &&
            window.matchMedia("(pointer: fine)").matches
          ) {
            els.tileserverInput.focus();
          }
        });
        if (els.catalogRow.hidden) els.catalogToggle.textContent = "Catalog \u25be";

        var bustCheckbox = document.getElementById("bust-cache");
        bustCheckbox.checked = bustCache;
        bustCheckbox.addEventListener("change", function () {
          bustCache = bustCheckbox.checked;
          try {
            localStorage.setItem("mapcompare:bust", bustCache ? "1" : "0");
          } catch (err) {
            void err;
          }
          // Rebuild with (un)busted style URLs.
          if (state.mode === "11") enterCompare("11");
          else if (state.mode === "swipe") enterCompare("swipe");
          else enterNormal();
        });

        updateTileserverUI();
        // Mode cycles normal -> swipe -> 1:1 -> normal; the button label
        // always names the NEXT mode (and doubles as the state display).
        els.modeToggle.addEventListener("click", function () {
          var next =
            state.mode === "normal"
              ? "swipe"
              : state.mode === "swipe"
                ? "11"
                : "normal";
          state.mode = next;
          if (next === "normal") {
            enterNormal();
          } else {
            enterCompare(next);
          }
          syncPermalink();
        });
        els.inspectToggle.addEventListener("click", toggleInspect);

        // ---------- clipboard helper ----------
        // Clipboard API needs a secure context (https or localhost) — the
        // demo is often opened over plain http on the tailnet, so fall back
        // to the execCommand path.
        function copyText(text) {
          if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
          }
          return new Promise(function (resolve, reject) {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.cssText = "position:fixed;top:-100vh;opacity:0";
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
              document.execCommand("copy") ? resolve() : reject();
            } catch (err) {
              reject(err);
            } finally {
              ta.remove();
            }
          });
        }

        bootCatalog();
      })();
    </script>
  </body>
</html>
