{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wodore basemap compare</title>

    <!-- Vendored assets (pinned versions, no CDN, works offline) -->
    <link rel="stylesheet" href="{% static 'demos/vendor/maplibre-gl.css' %}" />
    <link
      rel="stylesheet"
      href="{% static 'demos/vendor/map-gl-style-switcher.css' %}"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #1c1c1c;
      }

      #bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        padding: 6px 10px;
        background: #f2f7f4;
        border-bottom: 1px solid #d0d8d2;
      }

      /* Mobile: the permalink gives up its reserved width; the catalog
         input lives on its own collapsible row (see #catalog-row) so the
         primary buttons never wrap off-screen. */
      @media (max-width: 640px) {
        #permalink {
          max-width: 40vw;
        }
      }

      /* Collapsible catalog row: second header line with the input,
         toggled by #catalog-toggle. Collapsed by default on narrow
         screens (JS), always open-able. */
      #catalog-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-basis: 100%;
        min-width: 0;
      }

      #catalog-row[hidden] {
        display: none;
      }

      #catalog-row #tileserver-input {
        flex: 1 1 160px;
        min-width: 0;
      }

      #bar button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid #9aa8a0;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }

      #bar button:hover {
        background: #e8efe9;
      }

      #bar label {
        color: #4d6b58;
        white-space: nowrap;
      }

      #tileserver-input {
        font:
          12px ui-monospace,
          monospace;
        padding: 3px 6px;
        border: 1px solid #9aa8a0;
        border-radius: 4px;
        width: 240px;
      }

      #martin-link {
        font-size: 12px;
        color: #4d6b58;
      }

      #martin-link a {
        color: #2a6;
        text-decoration: none;
      }

      #martin-link a:hover {
        text-decoration: underline;
      }

      #permalink {
        margin-left: auto;
        color: #4d6b58;
        font-family: ui-monospace, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 30%;
      }

      .mode {
        position: absolute;
        top: 37px;
        bottom: 0;
        left: 0;
        right: 0;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      #compare-wrap {
        position: absolute;
        inset: 0;
      }

      .compare-side {
        position: absolute;
        inset: 0;
      }

      /* keep each side's style switcher inside its half */
      #compare-a .maplibregl-ctrl-top-left {
        max-width: 50%;
      }

      /* compare slider (built-in) */
      #compare-handle {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 4px;
        margin-left: -2px;
        background: #fff;
        border: 1px solid #4d6b58;
        cursor: ew-resize;
        z-index: 10;
        touch-action: none;
      }

      /* Portrait / tall viewports: stack the sides vertically (B below
         the seam) and turn the handle into a horizontal bar. Toggled by
         JS (wrap.clientHeight > wrap.clientWidth), not a media query, so
         embedded/non-viewport sizes behave the same. */
      #compare-handle.vertical {
        top: 0;
        bottom: auto;
        left: 0;
        right: 0;
        width: auto;
        height: 4px;
        margin: -2px 0 0 0;
        cursor: ns-resize;
      }

      #compare-handle.vertical::after {
        content: "↕";
      }

      /* Vertical compare: B's top-right switcher would sit above the
         seam and get clipped away — flip it to the bottom-right. */
      #compare-wrap.compare-vertical #compare-b .maplibregl-ctrl-top-right {
        top: auto;
        bottom: 0;
      }

      #compare-wrap.compare-vertical #compare-b
        .maplibregl-ctrl-top-right
        .maplibregl-ctrl {
        margin-bottom: 34px;
      }

      #compare-handle::after {
        content: "↔";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 14px;
        color: #1c1c1c;
        background: #fff;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #4d6b58;
      }

      /* stats.js panel: pin it below the header, right side */
      #fps-panel {
        position: fixed;
        top: 45px;
        right: 8px;
        z-index: 1000;
        cursor: pointer;
      }

      #fps-dom {
        position: static !important;
        top: auto !important;
        left: auto !important;
      }

      /* Style switcher (vendored control, tuned here):
         - list height tracks the viewport (vendored default is a fixed
           300px — too short for 12 catalog basemaps on phones, and it
           clipped inside the bottom half of a vertical compare)
         - touch-sized rows, no wrap, readable names */
      .maplibregl-ctrl.style-switcher .style-switcher-list {
        max-height: min(70vh, 420px) !important;
        overscroll-behavior: contain;
      }

      /* Two-line entries: display name over the slug. Scoped to the list
         so the collapsed chip keeps the vendored row layout. */
      .maplibregl-ctrl.style-switcher .style-switcher-list .style-switcher-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        min-height: 44px;
        padding: 4px 8px;
        white-space: normal;
      }

      .style-switcher-item .ss-name {
        line-height: 1.25;
      }

      .style-switcher-item .ss-slug {
        font:
          10px/1.3 ui-monospace,
          monospace;
        color: #68766e;
      }

      .style-switcher-item .ss-star {
        color: #d59b13;
        margin-right: 3px;
      }

      @media (pointer: coarse) {
        .maplibregl-ctrl.style-switcher .style-switcher-item {
          min-height: 40px;
          padding: 6px 10px;
          transform: none; /* hover-lift reads as tap-jitter on touch */
        }

        .maplibregl-ctrl.style-switcher
          .style-switcher-list
          .style-switcher-item {
          min-height: 48px;
        }
      }

      /* 1:1 compare: two independent halves, no clip, no slider. Side by
         side in landscape, stacked in portrait. */
      #compare-wrap.grid11 {
        display: flex;
        flex-direction: row;
      }

      @media (orientation: portrait) {
        #compare-wrap.grid11 {
          flex-direction: column;
        }
      }

      #compare-wrap.grid11 .compare-side {
        position: relative;
        inset: auto;
        flex: 1 1 50%;
        min-width: 0;
        min-height: 0;
      }

      #compare-wrap.grid11 #compare-a {
        border-right: 1px solid #4d6b58;
      }

      @media (orientation: portrait) {
        #compare-wrap.grid11 #compare-a {
          border-right: none;
          border-bottom: 1px solid #4d6b58;
        }
      }

      /* Compare modes (swipe + 1:1) hide the attribution expand buttons
         (both class spellings across maplibre versions). */
      #compare-wrap .maplibregl-ctrl-attrib-button,
      #compare-wrap .maplibre-ctrl-attrib-button {
        display: none;
      }

      /* Position readout (zoom/lat/lon) in the header — so screenshots
         carry their own coordinates. Updates live while moving. */
      #pos-readout {
        font: 11px/1.4 ui-monospace, monospace;
        color: #1c1c1c;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #c5cfc8;
        border-radius: 4px;
        padding: 2px 6px;
        white-space: nowrap;
      }

      #copy-style-btn.copied {
        background: #e4f4e4;
        border-color: #2a6;
        color: #1c5c1c;
      }

      /* built-in inspect popup */
      .inspect-popup {
        font:
          11px ui-monospace,
          monospace;
        background: #fff;
        border: 1px solid #9aa8a0;
        border-radius: 4px;
        padding: 4px 8px;
        max-width: 340px;
      }

      .inspect-popup .layer-id {
        font-weight: 700;
        color: #2a6;
      }

      .inspect-popup .source-layer {
        color: #666;
      }

      .inspect-popup .props {
        color: #333;
        margin-top: 2px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <header id="bar">
      <button id="mode-toggle" type="button">Compare mode</button>
      <button id="inspect-toggle" type="button" hidden>Inspect: off</button>
      <button id="copy-style-btn" type="button" title="Copy the current style's JSON URL">
        Copy style URL
      </button>
      <button id="catalog-toggle" type="button" title="Show/hide the catalog URL row">Catalog ▾</button>
      <span id="pos-readout" hidden></span>
      <span id="permalink" title="current view, copy me"></span>
      <div id="catalog-row">
        <label for="tileserver-input">Catalog:</label>
        <input
          id="tileserver-input"
          type="text"
          title="Catalog URL (persisted; ?catalog= overrides on load; e.g. http://localhost:3745/v1/map/catalog or http://localhost:3739/catalog for Martin)"
        />
        <span id="catalog-link"
          ><a target="_blank" rel="noopener">Catalog ↗</a></span
        >
      </div>
    </header>

    <!-- normal mode -->
    <main id="normal" class="mode">
      <div id="map"></div>
    </main>

    <!-- compare mode -->
    <main id="compare" class="mode" hidden>
      <div id="compare-wrap">
        <div id="compare-a" class="compare-side"></div>
        <div id="compare-b" class="compare-side"></div>
      </div>
    </main>

    <script src="{% static 'demos/vendor/maplibre-gl.js' %}"></script>
    <script src="{% static 'demos/vendor/map-gl-style-switcher.js' %}"></script>
    <script src="{% static 'demos/vendor/stats.min.js' %}"></script>
    <script>
      /* Wodore basemap compare — dev tool (server.apps.demos).
       *
       * Vendored pins: maplibre-gl@5.6.0 UMD, map-gl-style-switcher@0.10.1
       * UMD, stats.js@0.17.0 (FPS via rAF — mapbox-gl-framerate is not on
       * npm). Inspect is a built-in popup (maplibre-gl-inspect@0.0.10 was
       * incompatible with maplibre-gl 5.x — documented in the PR).
       */
      (function () {
        "use strict";

        var q = new URLSearchParams(location.search);
        var DEFAULT_CATALOG = location.origin + "/v1/map/catalog";
        var CATALOG_URL =
          q.get("catalog") ||
          localStorage.getItem("mapcompare:catalog") ||
          DEFAULT_CATALOG;

        var FALLBACK_STYLES = [
          "wd-outdoor-base-mtk-hill", // the product default (frontend PR #292)
          "wd-outdoor-base-mtk",
          "wd-outdoor-base-ofm",
          "wd-outdoor-base-ofm-hill",
        ];
        var state = {
          style: q.get("style") || "wd-outdoor-base-mtk-hill",
          styleB: q.get("styleB") || "wd-outdoor-base-ofm",
          zoom: parseFloat(q.get("z") || "12"),
          center: [
            parseFloat(q.get("lon") || "11.4041"),
            parseFloat(q.get("lat") || "47.2692"),
          ],
          mode: (function () {
            var m = q.get("mode");
            if (m === "11" || m === "1:1") return "11";
            if (m === "compare" || m === "swipe") return "swipe";
            return "normal";
          })(),
          inspect: false,
        };
        var styleIds = FALLBACK_STYLES.slice();

        var els = {
          modeToggle: document.getElementById("mode-toggle"),
          inspectToggle: document.getElementById("inspect-toggle"),
          copyStyleBtn: document.getElementById("copy-style-btn"),
          catalogToggle: document.getElementById("catalog-toggle"),
          catalogRow: document.getElementById("catalog-row"),
          tileserverInput: document.getElementById("tileserver-input"),
          catalogLink: document.querySelector("#catalog-link a"),
          permalink: document.getElementById("permalink"),
          normal: document.getElementById("normal"),
          compare: document.getElementById("compare"),
        };

        var normalMap = null;
        var compareMaps = null;
        var fpsStats = null;
        var fpsRaf = 0;
        var inspectPopup = null;
        var inspectHandler = null;

        // ---------- catalog URL ----------
        function catalogOrigin() {
          try {
            return new URL(CATALOG_URL).origin;
          } catch (e) {
            return "";
          }
        }

        function updateTileserverUI() {
          els.tileserverInput.value = CATALOG_URL;
          els.catalogLink.href = CATALOG_URL;
        }

        function setTileserver(url) {
          var clean = url.trim();
          if (!clean || clean === CATALOG_URL) return;
          CATALOG_URL = clean;
          localStorage.setItem("mapcompare:catalog", CATALOG_URL);
          updateTileserverUI();
          syncPermalink();
          bootCatalog(); // re-fetch styles, rebuild switchers
        }

        els.tileserverInput.addEventListener("change", function () {
          setTileserver(this.value);
        });
        els.tileserverInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            setTileserver(this.value);
            this.blur();
          }
        });

        // ---------- helpers ----------
        function styleUrl(id) {
          // Backend catalog entries have explicit paths; Martin entries need
          // /style/{id}.json constructed from the catalog origin
          if (backendStyles[id]) return backendStyles[id];
          return catalogOrigin() + "/style/" + id + ".json";
        }

        // Style slugs -> backend style URLs (filled by fetchBackendCatalog)
        var backendStyles = {};
        // Style slugs -> display names from the catalog (fallback: slug)
        var styleNames = {};

        function styleDisplayName(id) {
          var name = styleNames[id] || id.replace(/^wd-outdoor-base-/, "");
          var prefix = id === "wd-outdoor-base-mtk-hill" ? "\u2605 " : "";
          return prefix + name;
        }

        function switcherStyles() {
          return styleIds.map(function (id) {
            return {
              id: id,
              name: styleDisplayName(id),
              uri: styleUrl(id),
            };
          });
        }

        function syncPermalink() {
          var p = new URLSearchParams();
          p.set("catalog", CATALOG_URL);
          p.set("style", state.style);
          if (state.mode !== "normal") p.set("styleB", state.styleB);
          p.set("z", state.zoom.toFixed(2));
          p.set("lon", state.center[0].toFixed(5));
          p.set("lat", state.center[1].toFixed(5));
          if (state.mode === "swipe") p.set("mode", "swipe");
          if (state.mode === "11") p.set("mode", "11");
          history.replaceState(null, "", location.pathname + "?" + p);
          els.permalink.textContent =
            "z" + state.zoom.toFixed(1) + " " + state.style;
        }

        function trackView(map) {
          map.on("moveend", function () {
            state.center = map.getCenter().toArray();
            state.zoom = map.getZoom();
            syncPermalink();
          });
        }

        // ---------- position readout ----------
        // Shows z / lat / lon live on the map (bottom-left) so screenshots
        // carry their coordinates. Attached to whichever map currently
        // drives the view: normal map, or side A in compare (cameras sync).
        var posReadout = document.getElementById("pos-readout");
        function bindPosReadout(map) {
          var fmt = function () {
            var c = map.getCenter();
            var lat = c.lat.toFixed(4) + "\u00b0" + (c.lat >= 0 ? "N" : "S");
            var lon =
              c.lng.toFixed(4) + "\u00b0" + (c.lng >= 0 ? "E" : "W");
            posReadout.textContent =
              "z" + map.getZoom().toFixed(2) + " \u00b7 " + lat + " " + lon;
          };
          map.on("move", fmt);
          fmt();
          posReadout.hidden = false;
        }

        function makeMap(container, styleId) {
          return new maplibregl.Map({
            container: container,
            style: styleUrl(styleId),
            center: state.center,
            zoom: state.zoom,
            attributionControl: { compact: true },
          });
        }

        // Reformat switcher list items into two lines (display name +
        // slug). The vendored control re-renders on every expand, so a
        // MutationObserver keeps the format applied; the list order
        // matches switcherStyles() one-to-one (the collapsed chip after
        // the list is left untouched).
        function twoLineSwitcherItems(container, stylesArr) {
          var items = container.querySelectorAll(
            ".style-switcher-list .style-switcher-item",
          );
          for (var i = 0; i < items.length; i++) {
            var el = items[i];
            var s = stylesArr[i];
            if (!s || el.dataset.twoLine) continue;
            el.dataset.twoLine = "1";
            var name = (s.name || "").replace(/^\u2605 /, "");
            el.textContent = "";
            if ((s.name || "").startsWith("\u2605 ")) {
              var star = document.createElement("span");
              star.className = "ss-star";
              star.textContent = "\u2605";
              el.appendChild(star);
            }
            var nameEl = document.createElement("span");
            nameEl.className = "ss-name";
            nameEl.textContent = name;
            el.appendChild(nameEl);
            var slug = document.createElement("span");
            slug.className = "ss-slug";
            slug.textContent = s.id;
            el.appendChild(slug);
          }
        }

        function addSwitcher(map, which) {
          var ctrl = new mapglstyleswitcher.StyleSwitcherControl({
            styles: switcherStyles(),
            activeStyleId: which === "B" ? state.styleB : state.style,
            showImages: false,
            onAfterStyleChange: function (prev, next) {
              if (!next) return;
              map.setStyle(next.uri);
              if (which === "B") state.styleB = next.id;
              else state.style = next.id;
              syncPermalink();
            },
          });
          // Side B's switcher goes top-right: the compare slider's clip-path
          // on compare-b hides top-left controls
          map.addControl(ctrl, which === "B" ? "top-right" : "top-left");
          // Touch: the vendored control expands on hover/focus only — no
          // hover on phones, and focus alone is unreliable. Tap-to-toggle:
          // a tap on the collapsed chip expands it; taps on list items keep
          // the vendored item handlers (the list is only rendered when
          // expanded, so the intercept only fires when collapsed).
          var container = ctrl._container;
          if (container) {
            container.addEventListener("click", function (e) {
              if (!container.querySelector(".style-switcher-list")) {
                e.stopPropagation();
                e.preventDefault();
                ctrl._setExpanded(true);
              }
            });
          }
          // two-line items (name + slug), re-applied on every re-render
          if (container) {
            var reformat = function () {
              twoLineSwitcherItems(container, switcherStyles());
            };
            new MutationObserver(reformat).observe(container, {
              childList: true,
              subtree: true,
            });
            reformat();
          }
        }

        // ---------- FPS (stats.js, rAF driven) ----------
        function startFps() {
          if (fpsStats) return;
          fpsStats = new Stats();
          fpsStats.showPanel(0);
          fpsStats.dom.id = "fps-dom";
          var wrap = document.createElement("div");
          wrap.id = "fps-panel";
          wrap.appendChild(fpsStats.dom);
          document.body.appendChild(wrap);
          var tick = function () {
            fpsStats.begin();
            fpsStats.end();
            fpsRaf = requestAnimationFrame(tick);
          };
          fpsRaf = requestAnimationFrame(tick);
        }
        function stopFps() {
          if (!fpsStats) return;
          cancelAnimationFrame(fpsRaf);
          var wrap = document.getElementById("fps-panel");
          if (wrap) wrap.remove();
          fpsStats = null;
        }

        // ---------- inspect (built-in popup) ----------
        // maplibre-gl-inspect@0.0.10 is incompatible with maplibre-gl 5.x
        // (its ESM bundle imports a peer `maplibre-gl` that resolves to a
        // second, older instance). This built-in does what the user needs:
        // click a feature → popup with layer.id + source-layer + props.
        function toggleInspect() {
          state.inspect = !state.inspect;
          els.inspectToggle.textContent =
            "Inspect: " + (state.inspect ? "on" : "off");
          if (state.inspect) enableInspect();
          else disableInspect();
        }

        function enableInspect() {
          if (!normalMap || inspectHandler) return;
          inspectHandler = function (e) {
            var feats = normalMap.queryRenderedFeatures(e.point);
            if (!feats.length) {
              if (inspectPopup) {
                inspectPopup.remove();
                inspectPopup = null;
              }
              return;
            }
            var f = feats[0];
            var props = Object.keys(f.properties || {})
              .slice(0, 8)
              .map(function (k) {
                return k + ": " + JSON.stringify(f.properties[k]);
              })
              .join("\n");
            var html =
              '<div class="inspect-popup">' +
              '<span class="layer-id">' +
              f.layer.id +
              "</span>" +
              ' <span class="source-layer">(' +
              (f.sourceLayer || f.source || "?") +
              ")</span>" +
              (props ? '<div class="props">' + props + "</div>" : "") +
              "</div>";
            if (inspectPopup) inspectPopup.remove();
            inspectPopup = new maplibregl.Popup({
              closeButton: false,
              closeOnClick: false,
            })
              .setLngLat(e.lngLat)
              .setHTML(html)
              .addTo(normalMap);
          };
          normalMap.on("click", inspectHandler);
          normalMap.getCanvas().style.cursor = "crosshair";
        }

        function disableInspect() {
          if (normalMap && inspectHandler) {
            normalMap.off("click", inspectHandler);
            normalMap.getCanvas().style.cursor = "";
          }
          inspectHandler = null;
          if (inspectPopup) {
            inspectPopup.remove();
            inspectPopup = null;
          }
        }

        // ---------- modes ----------
        function enterNormal() {
          teardown();
          els.normal.hidden = false;
          els.compare.hidden = true;
          els.inspectToggle.hidden = false;
          normalMap = makeMap("map", state.style);
          addSwitcher(normalMap, "A");
          trackView(normalMap);
          bindPosReadout(normalMap);
          startFps();
          if (state.inspect) enableInspect();
          els.modeToggle.textContent = "Compare mode";
        }

        function enterCompare(kind) {
          // kind: "swipe" (slider over one map) or "11" (two halves)
          teardown();
          els.normal.hidden = true;
          els.compare.hidden = false;
          els.inspectToggle.hidden = true;
          disableInspect();

          var wrap = document.getElementById("compare-wrap");
          if (kind === "11") wrap.classList.add("grid11");

          var a = makeMap("compare-a", state.style);
          var b = makeMap("compare-b", state.styleB);
          addSwitcher(a, "A");
          addSwitcher(b, "B");
          trackView(a);
          bindPosReadout(a);
          compareMaps = {
            a: a,
            b: b,
            handle:
              kind === "swipe"
                ? makeCompareSlider(a, b, "compare-wrap")
                : makeCameraSync(a, b),
          };
          // Button cycles to the next mode; label always names the NEXT
          // mode so it doubles as the state display.
          els.modeToggle.textContent =
            kind === "swipe" ? "Compare 1:1" : "Normal mode";
        }

        // ---------- camera sync (shared by swipe and 1:1) ----------
        // Mirror moves one way only while a jumpTo is in flight. The naive
        // movestart/syncA flag design ping-pongs — jumpTo fires movestart on
        // the destination, flipping the sync direction mid-gesture, and the
        // reverse sync cancels touch pinch-zoom ("cannot zoom in compare
        // mode"). The equality short-circuit also guards against a future
        // maplibre emitting jumpTo's move asynchronously. jumpTo has no
        // inertia, so skipping no-op jumps stops redundant churn per
        // inertial frame.
        function makeCameraSync(mapA, mapB) {
          var syncing = false;
          function sameCamera(a, b) {
            var ca = a.getCenter();
            var cb = b.getCenter();
            return (
              Math.abs(ca.lng - cb.lng) < 1e-9 &&
              Math.abs(ca.lat - cb.lat) < 1e-9 &&
              Math.abs(a.getZoom() - b.getZoom()) < 1e-6 &&
              Math.abs(a.getBearing() - b.getBearing()) < 1e-6 &&
              Math.abs(a.getPitch() - b.getPitch()) < 1e-6
            );
          }
          function syncCameras(src, dst) {
            if (syncing || sameCamera(src, dst)) return;
            syncing = true;
            try {
              dst.jumpTo({
                center: src.getCenter(),
                zoom: src.getZoom(),
                bearing: src.getBearing(),
                pitch: src.getPitch(),
              });
            } finally {
              syncing = false;
            }
          }
          mapA.on("move", function () {
            syncCameras(mapA, mapB);
          });
          mapB.on("move", function () {
            syncCameras(mapB, mapA);
          });
          return {
            remove: function () {},
          };
        }

        // ---------- compare slider (built-in, swipe mode) ----------
        function makeCompareSlider(mapA, mapB, wrapId) {
          var wrap = document.getElementById(wrapId);
          var sideB = document.getElementById("compare-b");
          var handle = document.createElement("div");
          handle.id = "compare-handle";
          wrap.appendChild(handle);

          var pos = 0.5;
          function isVertical() {
            return wrap.clientHeight > wrap.clientWidth;
          }
          function apply() {
            var vertical = isVertical();
            handle.classList.toggle("vertical", vertical);
            wrap.classList.toggle("compare-vertical", vertical);
            if (vertical) {
              var y = Math.round(pos * wrap.clientHeight);
              sideB.style.clipPath = "inset(" + y + "px 0 0 0)";
              handle.style.top = y + "px";
              handle.style.left = "0";
            } else {
              var x = Math.round(pos * wrap.clientWidth);
              sideB.style.clipPath = "inset(0 0 0 " + x + "px)";
              handle.style.left = x + "px";
              handle.style.top = "0";
            }
          }

          makeCameraSync(mapA, mapB);

          var dragging = false;
          handle.addEventListener("pointerdown", function (e) {
            dragging = true;
            handle.setPointerCapture(e.pointerId);
            e.preventDefault();
          });
          handle.addEventListener("pointermove", function (e) {
            if (!dragging) return;
            var rect = wrap.getBoundingClientRect();
            if (isVertical()) {
              pos = Math.min(
                1,
                Math.max(0, (e.clientY - rect.top) / rect.height),
              );
            } else {
              pos = Math.min(
                1,
                Math.max(0, (e.clientX - rect.left) / rect.width),
              );
            }
            apply();
          });
          handle.addEventListener("pointerup", function () {
            dragging = false;
          });
          handle.addEventListener("pointercancel", function () {
            dragging = false;
          });

          mapA.on("resize", apply);
          apply();
          return {
            remove: function () {
              handle.remove();
              wrap.classList.remove("compare-vertical");
              sideB.style.clipPath = "";
            },
          };
        }

        function teardown() {
          stopFps();
          disableInspect();
          document
            .getElementById("compare-wrap")
            .classList.remove("grid11", "compare-vertical");
          if (compareMaps) {
            if (compareMaps.handle && compareMaps.handle.remove) {
              try {
                compareMaps.handle.remove();
              } catch (err) {
                void err;
              }
            }
            if (compareMaps.a) compareMaps.a.remove();
            if (compareMaps.b) compareMaps.b.remove();
            compareMaps = null;
          }
          if (normalMap) {
            normalMap.remove();
            normalMap = null;
          }
        }

        // ---------- catalog / boot ----------
        // Fetches CATALOG_URL and parses the response. Works with both our
        // backend catalog (/v1/map/catalog, entries have .path relative URLs
        // and selector metadata) and Martin's catalog (/catalog, entries
        // have filesystem paths — style URLs constructed from origin).
        function bootCatalog() {
          var origin = catalogOrigin();
          fetch(CATALOG_URL)
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (cat) {
              if (!cat || !cat.styles) return null;
              var ids = [];
              backendStyles = {};
              styleNames = {};
              for (var slug in cat.styles) {
                if (!Object.prototype.hasOwnProperty.call(cat.styles, slug))
                  continue;
                var entry = cat.styles[slug];
                // Backend: entry.path is a relative URL like /v1/map/styles/slug.json
                // Martin: entry.path is a filesystem path — construct /style/slug.json
                var url;
                if (entry.path && entry.path.startsWith("/")) {
                  url = origin + entry.path;
                } else {
                  url = origin + "/style/" + slug + ".json";
                }
                backendStyles[slug] = url;
                styleNames[slug] =
                  entry.name ||
                  slug.replace(/^wd-outdoor-base-/, "");
                ids.push(slug);
              }
              // Catalog style entries carry no role — overlays (huts,
              // trails, …) leaked into the selector. The backend layers
              // endpoint has it; when reachable, keep basemaps only
              // (Martin catalogs have no layers endpoint → keep all,
              // Martin only serves basemap-ish styles anyway).
              var rolesUrl = origin + "/v1/map/layers";
              return fetch(rolesUrl)
                .then(function (r) {
                  return r.ok ? r.json() : null;
                })
                .catch(function () {
                  return null;
                })
                .then(function (ld) {
                  if (ld && ld.data) {
                    var roles = {};
                    var defaultSlug = null;
                    for (var i = 0; i < ld.data.length; i++) {
                      roles[ld.data[i].slug] = ld.data[i].role;
                      if (ld.data[i].is_default) defaultSlug = ld.data[i].slug;
                    }
                    ids = ids.filter(function (slug) {
                      return !roles[slug] || roles[slug] === "basemap";
                    });
                    // Adopt the catalog's default basemap when the URL
                    // pinned no explicit style — the first list entry is
                    // just an ordering, not the default.
                    if (defaultSlug && !q.get("style")) {
                      state.style = defaultSlug;
                    }
                  }
                  if (ids.length) styleIds = ids;
                });
            })
            .catch(function () {
              /* catalog unavailable: keep fallback list */
            })
            .finally(function () {
              if (state.mode === "11") {
                enterCompare("11");
              } else if (state.mode === "swipe") {
                enterCompare("swipe");
              } else {
                enterNormal();
              }
              syncPermalink();
            });
        }

        // ---------- boot ----------
        // Catalog row: collapsed by default on narrow screens (the input
        // pushed the primary buttons off-screen on phones), open on
        // desktop. The toggle flips it either way.
        els.catalogRow.hidden = window.matchMedia(
          "(max-width: 640px)",
        ).matches;
        els.catalogToggle.addEventListener("click", function () {
          els.catalogRow.hidden = !els.catalogRow.hidden;
          els.catalogToggle.textContent = els.catalogRow.hidden
            ? "Catalog \u25be"
            : "Catalog \u25b4";
          if (!els.catalogRow.hidden) els.tileserverInput.focus();
        });
        if (els.catalogRow.hidden) els.catalogToggle.textContent = "Catalog \u25be";

        updateTileserverUI();
        // Mode cycles normal -> swipe -> 1:1 -> normal; the button label
        // always names the NEXT mode (and doubles as the state display).
        els.modeToggle.addEventListener("click", function () {
          var next =
            state.mode === "normal"
              ? "swipe"
              : state.mode === "swipe"
                ? "11"
                : "normal";
          state.mode = next;
          if (next === "normal") {
            enterNormal();
          } else {
            enterCompare(next);
          }
          syncPermalink();
        });
        els.inspectToggle.addEventListener("click", toggleInspect);

        // ---------- copy style URL ----------
        // Clipboard API needs a secure context (https or localhost) — the
        // demo is often opened over plain http on the tailnet, so fall back
        // to the execCommand path.
        function copyText(text) {
          if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
          }
          return new Promise(function (resolve, reject) {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.cssText = "position:fixed;top:-100vh;opacity:0";
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
              document.execCommand("copy") ? resolve() : reject();
            } catch (err) {
              reject(err);
            } finally {
              ta.remove();
            }
          });
        }

        els.copyStyleBtn.addEventListener("click", function () {
          var url = styleUrl(state.style);
          copyText(url).then(
            function () {
              els.copyStyleBtn.classList.add("copied");
              var prev = els.copyStyleBtn.textContent;
              els.copyStyleBtn.textContent = "\u2713 copied";
              setTimeout(function () {
                els.copyStyleBtn.classList.remove("copied");
                els.copyStyleBtn.textContent = prev;
              }, 1200);
            },
            function () {
              var prev = els.copyStyleBtn.textContent;
              els.copyStyleBtn.textContent = url;
              setTimeout(function () {
                els.copyStyleBtn.textContent = prev;
              }, 2500);
            },
          );
        });

        bootCatalog();
      })();
    </script>
  </body>
</html>
