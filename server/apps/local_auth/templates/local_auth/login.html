<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wodore local dev login</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f4f5; display: flex;
           align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border-radius: 8px; padding: 2rem; width: 320px;
            box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    h1 { font-size: 1.1rem; margin: 0 0 1rem; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box;
            padding: .5rem; margin-bottom: .75rem; border: 1px solid #d4d4d8; border-radius: 4px; }
    button { width: 100%; padding: .5rem; background: #16a34a; color: #fff; border: 0;
             border-radius: 4px; font-size: 1rem; cursor: pointer; }
    .error { color: #b91c1c; margin-bottom: .75rem; font-size: .9rem; }
    .hint { color: #71717a; font-size: .8rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wodore &mdash; local dev login</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="{% url 'local_auth:authorize' %}">
      {% csrf_token %}
      {% for name, value in params.items %}
        {% if value %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endif %}
      {% endfor %}
      <input type="text" name="username" placeholder="Username (email)" autofocus autocomplete="username">
      <input type="password" name="password" placeholder="Password" autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
    <p class="hint">Local development provider &mdash; create users with<br>
      <code>app local_auth_users</code></p>
  </div>
</body>
</html>
