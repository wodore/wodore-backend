{% load static %}
{% include "django/forms/widgets/text.html" %}
<div class="bbox-widget" data-bbox-input-id="{{ widget.attrs.id }}"
     style="height: 320px; margin-top: 4px; border: 1px solid var(--border-color, #ccc); border-radius: 4px;"></div>
<p class="help" style="margin-top: 2px;">

  lon_min,lat_min,lon_max,lat_max above).
</p>

<script src="https://cdn.jsdelivr.net/npm/ol@v10.9.0/dist/ol.js"></script>
