{% load static %}
{% include "django/forms/widgets/text.html" %}
<div class="bbox-container">
  <div class="bbox-toolbar">
    <button type="button" class="bbox-draw-btn" aria-pressed="false">▭ Draw rectangle</button>
    <button type="button" class="bbox-clear-btn">✕ Clear</button>
    <span class="bbox-hint">Draw mode: drag on the map — works on touch too. Otherwise Shift + drag.</span>
  </div>
  <div class="bbox-widget" data-bbox-input-id="{{ widget.attrs.id }}"
       style="height: 320px; border: 1px solid var(--border-color, #ccc); border-radius: 4px;"></div>
</div>
<p class="help" style="margin-top: 2px;">
  Or type lon_min,lat_min,lon_max,lat_max above.
</p>
<style>
  .bbox-toolbar {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    margin: 4px 0;
  }
  .bbox-toolbar button {
    border: 1px solid var(--border-color, #999);
    border-radius: 4px;
    padding: 2px 10px;
    background: var(--body-bg, #fff);
    color: inherit;
    cursor: pointer;
    font-size: 12px;
  }
  .bbox-draw-btn[aria-pressed="true"] {
    background: #2f6fdb;
    border-color: #2f6fdb;
    color: #fff;
  }
  .bbox-hint {
    font-size: 11px;
    opacity: 0.7;
  }
</style>
{# Self-contained assets: the admin runner's run form does not render {{ form.media }}. #}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.9.0/ol.css">
<link rel="stylesheet" href="{% static 'gis/css/ol3.css' %}">
<script src="https://cdn.jsdelivr.net/npm/ol@v10.9.0/dist/ol.js"></script>
<script src="{% static 'geometries/js/bbox_widget.js' %}" defer></script>
