# Seed configuration for pre-warming the merged cache.
# Run inside the container:
#   docker compose exec mapproxy mapproxy-seed -f /mapproxy/config/mapproxy.yaml /mapproxy/config/seed.yaml
seeds:
  seed_europe_topo_low:
    caches: [europe_topo_cache]
    grids: [webmercator]
    levels:
      to: 12 # ~5 GB, warm in a few hours; z0-12 covers the overview use case
    coverages: [europe]

coverages:
  europe:
    bbox: [-11, 34, 32, 71]
    srs: "EPSG:4326"
