<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wodore basemap compare</title>

    <!-- MapLibre GL JS (UMD, pinned) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>

    <!-- Style switcher control (UMD, pinned) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/map-gl-style-switcher@0.10.1/dist/map-gl-style-switcher.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/map-gl-style-switcher@0.10.1/dist/index.umd.js"></script>

    <!-- Compare slider + inspect plugins ship ESM-only bundles:
         loaded via dynamic import() from mapcompare.js (jsDelivr +esm). -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-compare@0.5.0/dist/maplibre-gl-compare.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl-inspect@0.0.10/dist/style.css"
    />

    <!-- FPS meter: stats.js driven by rAF, labelled FPS -->
    <script src="https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js"></script>

    <link rel="stylesheet" href="mapcompare.css" />
  </head>
  <body>
    <header id="bar">
      <button id="mode-toggle" type="button">Compare mode</button>
      <button id="inspect-toggle" type="button" hidden>Inspect: off</button>
      <span id="tileserver" title="override with ?tileserver="></span>
      <span id="permalink" title="current view, copy me"></span>
    </header>

    <!-- normal mode -->
    <main id="normal" class="mode">
      <div id="map"></div>
    </main>

    <!-- compare mode -->
    <main id="compare" class="mode" hidden>
      <div id="compare-wrap">
        <div id="compare-a" class="compare-side"></div>
        <div id="compare-b" class="compare-side"></div>
      </div>
    </main>

    <script src="mapcompare.js"></script>
  </body>
</html>
